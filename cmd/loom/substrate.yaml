# Loom on Substrate. The manifest is the shell: modules and config.
app: loom
variant: app-host
profiles: [minimal]
modules:
  add: [secrets, auth, database, identity, mcp, cli]
config:
  logging: { level: info, format: text }
  httphost: { addr: "127.0.0.1:8080" }
  database:
    sqlite: { path: loom.db }
  auth: { mode: enforce }
  identity: { key_file: identity-signing.key, session_ttl: 12h }
  # The data directory is resolved at run time (project-local .loom/, -db/-workspace, XDG); the
  # binary replaces the database, key and secrets paths with absolute ones before the modules start.
  # env: true so loom.llm_api_key_ref can be env://ANTHROPIC_API_KEY, the old way to supply the key.
  secrets: { state_dir: secrets, env: true }
  # /mcp needs the loom.mcp scope; stdio needs a token file (mcp.stdio_token_file) in enforce mode.
  mcp: { version: "0.1.0", scope: loom.mcp }
