kind: cerberus-project/v1
owner: loom
namespace: local
project:
  id: loom
  name: Loom
resources:
  - id: loom-dev
    name: Loom API (Dev)
    type: process
    project: loom
    connector: local
    env: dev
    owner: self
    admin: self
    config:
      build_strategy:
        kind: make_standard
      command:
        - ./loom
        - serve
      dir: ~/dev/hollis-labs/apps/loom
      # Settings live in the SUBSTRATE_CONFIG file: httphost.addr 127.0.0.1:8092, loom.otel_enabled,
      # loom.llm_api_key_ref keychain://anthropic/loom. See docs/conversion-notes.md.
      env:
        SUBSTRATE_CONFIG: ~/dev/hollis-labs/apps/loom/loom.local.yaml
      mode: os_service
      port: 8092
      run_from: artifact
      supervisor: launchd
      url: http://127.0.0.1:8092
    tags:
      - api
      - go
      - launchd
      - artifact
      - dev
      - loom
      - v2
registry_urn: msg://agent/agent-mux/prj_slovv6icj9
